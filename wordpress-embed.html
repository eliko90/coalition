<!--
  Road to 61 — WordPress embed
  ----------------------------
  Paste this whole block into a "Custom HTML" block on the WordPress page at
  kowaz.com/coalition.

  Change ONLY the two lines marked CHANGE ME to wherever the app is hosted.
  Both must be the same origin, and it must be https.

  The iframe sizes itself: the app posts its height to this page as it renders,
  so there is no inner scrollbar and no guessed fixed height. The `allow`
  attribute is what keeps "Share" working from inside the frame — without
  clipboard-write and web-share, the share menu silently fails.
-->

<!-- No width cap here: the app sets its own, so changing how wide it
     runs never means re-pasting this block again. -->
<div id="kcb-wrap" style="max-width:100%;margin:0 auto;">
  <iframe
    id="kcb-frame"
    src="https://eliko90.github.io/coalition/"
    data-app="https://eliko90.github.io/coalition/"
    title="Road to 61 — build Israel's next coalition"
    scrolling="no"
    allow="clipboard-write; web-share"
    style="width:100%;height:2400px;border:0;display:block;overflow:hidden;"
  ></iframe>
  <noscript>
    <p style="font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;">
      This interactive needs JavaScript.
      <a href="https://eliko90.github.io/coalition/">Open it in a new tab</a>.
    </p>
  </noscript>
</div>

<script>
(function () {
  // CHANGE ME — must match the iframe src origin exactly (no trailing slash).
  var APP_ORIGIN = 'https://eliko90.github.io';

  var frame = document.getElementById('kcb-frame');
  if (!frame) return;

  // A shared link looks like kowaz.com/coalition?c=likud.shas.utj — hand that
  // straight to the app so the reader opens the sender's board, not a blank one.
  var q = new URLSearchParams(window.location.search).get('c');
  if (q && /^[a-z0-9_.]+$/i.test(q)) {
    frame.src = frame.getAttribute('data-app') + '?c=' + encodeURIComponent(q);
  }

  // The app is a full-height frame, so nothing scrolls inside it and
  // position:fixed pins to the whole 8,000px document rather than the screen.
  // Only this page knows which slice the reader is looking at, so tell it.
  function reportViewport() {
    var r = frame.getBoundingClientRect();
    var top = Math.max(0, -r.top);
    var bottom = Math.min(r.height, window.innerHeight - r.top);
    frame.contentWindow.postMessage({
      type: 'kcb-viewport',
      offset: top,
      height: Math.max(0, bottom - top)
    }, APP_ORIGIN);
  }
  var queued = false;
  function onScroll() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; reportViewport(); });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  frame.addEventListener('load', reportViewport);

  window.addEventListener('message', function (e) {
    // Only listen to the app. Without this check any page in any other iframe
    // on this post could resize ours.
    if (e.origin !== APP_ORIGIN) return;
    var d = e.data;

    // Mirror the board into this page's address bar as it is built, so the URL
    // is always copyable. replaceState keeps the back button usable.
    if (d && d.type === 'kcb-coalition') {
      var ids = Array.isArray(d.ids) ? d.ids.filter(function (x) {
        return typeof x === 'string' && /^[a-z0-9_]+$/i.test(x);
      }) : [];
      var drop = Array.isArray(d.drop) ? d.drop.filter(function (x) {
        return typeof x === 'string' && /^[a-z0-9_]+$/i.test(x);
      }) : [];
      var poll = typeof d.poll === 'string' && /^[a-z0-9_-]*$/i.test(d.poll)
        ? d.poll.toLowerCase().replace(/[^a-z0-9]/g, '') : '';
      var v = ids.join('.');
      if (drop.length) v += (v ? '._x_.' : '_x_.') + drop.join('.');
      if (poll) v += '._p_.' + poll;
      try {
        history.replaceState(null, '',
          window.location.pathname + (v ? '?c=' + v : ''));
      } catch (err) { /* not fatal */ }
      return;
    }

    if (d && d.type === 'kcb-need-viewport') { reportViewport(); return; }

    if (!d || d.type !== 'kcb-resize') return;
    var h = parseInt(d.height, 10);
    if (!h || h < 400 || h > 20000) return;
    frame.style.height = h + 'px';
    reportViewport();          // the frame just moved under the reader
  }, false);
})();
</script>
